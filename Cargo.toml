[workspace]
resolver = "2"
members = [
    "crates/sg-model",
    "crates/sg-transport",
    "crates/sg-collect",
    "crates/sg-core",
    "crates/sg-ffi",
    "crates/sg-sync",
    "crates/sg-bindgen",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lazarevtill/ServerGlass"

[workspace.dependencies]
sg-model = { path = "crates/sg-model" }
sg-transport = { path = "crates/sg-transport" }
sg-collect = { path = "crates/sg-collect" }
sg-core = { path = "crates/sg-core" }
sg-sync = { path = "crates/sg-sync" }

anyhow = "1.0"
async-trait = "0.1"
russh = "0.62"
# Pairing crypto. X25519 for the key agreement, ChaCha20-Poly1305 for the payload — both already
# pulled in transitively by russh, so this adds no new supply chain.
x25519-dalek = { version = "3.0", features = ["static_secrets"] }
chacha20poly1305 = "0.11"
hkdf = "0.13"
sha2 = "0.11"
rand = "0.10"
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uniffi = "0.32"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
