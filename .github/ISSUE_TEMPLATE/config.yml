# Security reports must not become public issues, so the blank-issue escape hatch is closed and
# the advisory form is offered in its place.
blank_issues_enabled: false
contact_links:
  - name: Security vulnerability
    url: https://github.com/lazarevtill/ServerGlass/security/advisories/new
    about: Report privately. Please do not open a public issue for anything security-relevant.
  - name: How do I…?
    url: https://github.com/lazarevtill/ServerGlass/blob/main/docs/GUIDE.md
    about: The guide walks through each flow with screenshots — adding a server, signing in, pairing.
  - name: Building it
    url: https://github.com/lazarevtill/ServerGlass/blob/main/README.md#building
    about: Per-platform build instructions. Windows has its own page, docs/WINDOWS.md.
