# The same checks the canonical GitLab pipeline runs, for the public GitHub mirror.
#
# Kept deliberately in step with .gitlab-ci.yml: the core on Linux and on Windows, the Linux app in
# a job of its own because it is a separate cargo workspace that needs GTK, and the Windows app in
# one of its own because it is C# and needs a .NET SDK. If you change one, change the other — a
# mirror whose CI checks less than the original is worse than no mirror, because the green tick
# claims something it did not verify.
#
# One job runs here and not there, deliberately: `android`. GitHub's Linux runners ship the Android
# SDK and NDK preinstalled and GitLab's docker executor does not, so this is the only place the
# F-Droid build path can be exercised without standing up a new image. That path is otherwise
# untested by anything automatic, and it is the one a rejected submission would be traced back to.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Pinned rather than stable: the lockfile pins cargo-platform for a toolchain floor, and a
  # silently-moving compiler is not something a CI failure should ever be traced back to.
  RUST_VERSION: "1.89.0"

jobs:
  core:
    name: Core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows earned its place in CI on the first run by catching a Unix-only agent call that
        # had been sitting in the tree. This job is the core only; the app has its own below.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: |
          rustup toolchain install ${{ env.RUST_VERSION }} --profile minimal --component clippy,rustfmt
          rustup default ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build --workspace --locked
      # SG_REQUIRE_FIXTURES is deliberately not set: the live SSH tests need the Docker fixtures,
      # detect their absence and skip. Everything that does not need a real host still runs.
      - run: cargo test --workspace --locked

  linux-app:
    name: Linux app
    # 24.04 ships GTK 4.14 and libadwaita 1.5; the app needs 4.10 and 1.4 at least.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install GTK
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libadwaita-1-dev
      - name: Install Rust
        run: |
          rustup toolchain install ${{ env.RUST_VERSION }} --profile minimal --component clippy,rustfmt
          rustup default ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/linux
      - name: Check the app
        working-directory: apps/linux
        run: |
          cargo fmt -- --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked

  windows-app:
    name: Windows app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: |
          rustup toolchain install ${{ env.RUST_VERSION }} --profile minimal
          rustup default ${{ env.RUST_VERSION }}
      - uses: actions/setup-dotnet@v6
        with:
          # Pinned to the channel the app targets, for the same reason the Rust toolchain is.
          dotnet-version: "9.0.x"
      - uses: Swatinem/rust-cache@v2
      # The core first: the app's project file refuses to build without sg_ffi.dll, because an app
      # that compiles without the core only fails when somebody runs it.
      - run: cargo build -p sg-ffi --locked
      # The committed C# bindings must match the Rust they came from. Generated code that is
      # allowed to go stale is a crash at runtime and nothing at build time.
      - run: pwsh -File scripts/check-bindings.ps1
      # Debug, and the core's path passed explicitly, so the profile the app links matches the one
      # just built. A release app around a debug core would still pass and still be incoherent.
      - run: dotnet test apps/windows/ServerGlass.Core.Tests/ServerGlass.Core.Tests.csproj -c Debug --nologo "-p:SgFfiDll=${{ github.workspace }}/target/debug/sg_ffi.dll"
      - run: dotnet build apps/windows/ServerGlass/ServerGlass.csproj -c Debug --nologo "-p:SgFfiDll=${{ github.workspace }}/target/debug/sg_ffi.dll"
      # Every PowerShell script in the tree, parsed. Nothing else here runs them — check.ps1 and the
      # packaging scripts are for a developer at a Windows machine — so a syntax error in one would
      # reach that developer rather than this pipeline, and the machines that could have caught it
      # are the ones nobody develops on. Parsing needs no toolchain and takes no time.
      - name: Parse the PowerShell scripts
        shell: pwsh
        run: |
          $bad = $false
          Get-ChildItem scripts/*.ps1 | ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) {
              $bad = $true
              Write-Host "$($_.Name):"
              $errors | ForEach-Object { Write-Host "  $($_.Extent.StartLineNumber): $($_.Message)" }
            }
          }
          if ($bad) { exit 1 }

  android:
    name: Android app (the F-Droid build path)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      # Pinned, and installed by the action rather than taken from the runner image. There is no
      # gradle-wrapper.jar in this repository on purpose — it is a committed binary, which is the
      # one thing an F-Droid submission must not contain — so without this the build would run on
      # whatever Gradle the image happened to ship that week. 9.7.0 is what the local build and the
      # clean-clone dry run both used against AGP 8.9.0.
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.7.0"
      - name: Install Rust and the Android target
        run: |
          rustup toolchain install ${{ env.RUST_VERSION }} --profile minimal
          rustup default ${{ env.RUST_VERSION }}
          rustup target add aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      # Pinned to the version scripts/build-android.sh and the F-Droid recipe both name. cargo-ndk
      # resolves the NDK from ANDROID_NDK_HOME, so the two have to agree.
      - run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: Pick the NDK the recipe asks for
        run: echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      # The three prebuild steps from docs/fdroid/cloud.lazarev.serverglass.yml, in order. If this
      # job fails, the F-Droid recipe is broken — that is the entire point of running it.
      #
      # -P 26 must match minSdk in app/build.gradle.kts: the NDK links against that API level's
      # libc, and a mismatch is a loader failure at runtime rather than an error here.
      - name: Cross-compile the core for arm64-v8a
        run: cargo ndk -t arm64-v8a -P 26 -o apps/android/app/src/main/jniLibs build --release -p sg-ffi
      # Generated from the host library: uniffi reads architecture-independent metadata, and there
      # is no Android .so to introspect on the build machine's own architecture.
      - run: cargo build -p sg-ffi --locked
      # `--bin` is not optional: sg-bindgen also ships a C# generator, so an unqualified
      # `cargo run -p sg-bindgen` is ambiguous and fails.
      - name: Generate the Kotlin bindings
        run: |
          cargo run -q -p sg-bindgen --bin uniffi-bindgen -- generate \
            --library target/debug/libsg_ffi.so \
            --language kotlin \
            --out-dir apps/android/app/build/generated/uniffi
      # The Kotlin tests cover the record format, and had no runner anywhere until this job.
      - name: Test and assemble
        working-directory: apps/android
        run: |
          gradle --no-daemon :app:testDebugUnitTest
          gradle --no-daemon :app:assembleRelease
