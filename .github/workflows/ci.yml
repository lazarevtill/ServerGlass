# The same checks the canonical GitLab pipeline runs, for the public GitHub mirror.
#
# Kept deliberately in step with .gitlab-ci.yml: the core on Linux and on Windows, and the Linux
# app in a job of its own because it is a separate cargo workspace that needs GTK. If you change
# one, change the other — a mirror whose CI checks less than the original is worse than no mirror,
# because the green tick claims something it did not verify.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Pinned rather than stable: the lockfile pins cargo-platform for a toolchain floor, and a
  # silently-moving compiler is not something a CI failure should ever be traced back to.
  RUST_VERSION: "1.89.0"

jobs:
  core:
    name: Core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is a target platform with no app yet. It earned its place in CI on the first run
        # by catching a Unix-only agent call that had been sitting in the tree.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup toolchain install ${{ env.RUST_VERSION }} --profile minimal --component clippy,rustfmt
          rustup default ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build --workspace --locked
      # SG_REQUIRE_FIXTURES is deliberately not set: the live SSH tests need the Docker fixtures,
      # detect their absence and skip. Everything that does not need a real host still runs.
      - run: cargo test --workspace --locked

  linux-app:
    name: Linux app
    # 24.04 ships GTK 4.14 and libadwaita 1.5; the app needs 4.10 and 1.4 at least.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libadwaita-1-dev
      - name: Install Rust
        run: |
          rustup toolchain install ${{ env.RUST_VERSION }} --profile minimal --component clippy,rustfmt
          rustup default ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/linux
      - name: Check the app
        working-directory: apps/linux
        run: |
          cargo fmt -- --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked
