# The same checks the canonical GitLab pipeline runs, for the public GitHub mirror.
#
# Kept deliberately in step with .gitlab-ci.yml: the core on Linux and on Windows, the Linux app in
# a job of its own because it is a separate cargo workspace that needs GTK, and the Windows app in
# one of its own because it is C# and needs a .NET SDK. If you change one, change the other — a
# mirror whose CI checks less than the original is worse than no mirror, because the green tick
# claims something it did not verify.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Pinned rather than stable: the lockfile pins cargo-platform for a toolchain floor, and a
  # silently-moving compiler is not something a CI failure should ever be traced back to.
  RUST_VERSION: "1.89.0"

jobs:
  core:
    name: Core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows earned its place in CI on the first run by catching a Unix-only agent call that
        # had been sitting in the tree. This job is the core only; the app has its own below.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup toolchain install ${{ env.RUST_VERSION }} --profile minimal --component clippy,rustfmt
          rustup default ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build --workspace --locked
      # SG_REQUIRE_FIXTURES is deliberately not set: the live SSH tests need the Docker fixtures,
      # detect their absence and skip. Everything that does not need a real host still runs.
      - run: cargo test --workspace --locked

  linux-app:
    name: Linux app
    # 24.04 ships GTK 4.14 and libadwaita 1.5; the app needs 4.10 and 1.4 at least.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libadwaita-1-dev
      - name: Install Rust
        run: |
          rustup toolchain install ${{ env.RUST_VERSION }} --profile minimal --component clippy,rustfmt
          rustup default ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/linux
      - name: Check the app
        working-directory: apps/linux
        run: |
          cargo fmt -- --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked

  windows-app:
    name: Windows app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup toolchain install ${{ env.RUST_VERSION }} --profile minimal
          rustup default ${{ env.RUST_VERSION }}
      - uses: actions/setup-dotnet@v4
        with:
          # Pinned to the channel the app targets, for the same reason the Rust toolchain is.
          dotnet-version: "9.0.x"
      - uses: Swatinem/rust-cache@v2
      # The core first: the app's project file refuses to build without sg_ffi.dll, because an app
      # that compiles without the core only fails when somebody runs it.
      - run: cargo build -p sg-ffi --locked
      # The committed C# bindings must match the Rust they came from. Generated code that is
      # allowed to go stale is a crash at runtime and nothing at build time.
      - run: pwsh -File scripts/check-bindings.ps1
      # Debug, and the core's path passed explicitly, so the profile the app links matches the one
      # just built. A release app around a debug core would still pass and still be incoherent.
      - run: dotnet test apps/windows/ServerGlass.Core.Tests/ServerGlass.Core.Tests.csproj -c Debug --nologo "-p:SgFfiDll=${{ github.workspace }}/target/debug/sg_ffi.dll"
      - run: dotnet build apps/windows/ServerGlass/ServerGlass.csproj -c Debug --nologo "-p:SgFfiDll=${{ github.workspace }}/target/debug/sg_ffi.dll"
