[package]
name = "sg-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "UniFFI bindings for the ServerGlass core."

[lib]
# staticlib for Apple targets, cdylib for Android/Windows, rlib so the bindgen binary can link it.
crate-type = ["staticlib", "cdylib", "rlib"]
name = "sg_ffi"

[dependencies]
sg-core = { workspace = true }
sg-sync = { workspace = true }
sg-model = { workspace = true }
sg-transport = { workspace = true }
# The C ABI in `cabi.rs` moves whole view models across as JSON rather than as C structs; see the
# module header for why. Both were already in the tree through sg-sync, so this adds no supply chain.
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uniffi = { workspace = true }

[build-dependencies]
uniffi = { workspace = true, features = ["build"] }
