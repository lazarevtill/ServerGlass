[package]
name = "sg-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "UniFFI bindings for the ServerGlass core."

[lib]
# staticlib for Apple targets, cdylib for Android/Windows, rlib so the bindgen binary can link it.
crate-type = ["staticlib", "cdylib", "rlib"]
name = "sg_ffi"

[dependencies]
sg-core = { workspace = true }
sg-sync = { workspace = true }
sg-model = { workspace = true }
sg-transport = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uniffi = { workspace = true }

[build-dependencies]
uniffi = { workspace = true, features = ["build"] }
