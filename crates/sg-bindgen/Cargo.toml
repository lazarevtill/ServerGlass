[package]
name = "sg-bindgen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Binding generator for sg-ffi. A separate crate so clap never reaches the shipped library."
publish = false

[[bin]]
name = "uniffi-bindgen"
path = "src/main.rs"

# The C# side. Separate from `uniffi-bindgen` because it reads `cabi.rs` rather than the UniFFI
# scaffolding, and lives here for the same reason that one does: neither generator belongs in the
# library that ships inside an app.
[[bin]]
name = "csharp-bindgen"
path = "src/csharp.rs"

[dependencies]
csbindgen = "1.9.6"
uniffi = { workspace = true, features = ["cli"] }
