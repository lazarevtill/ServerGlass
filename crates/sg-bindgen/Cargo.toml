[package]
name = "sg-bindgen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Binding generator for sg-ffi. A separate crate so clap never reaches the shipped library."
publish = false

[[bin]]
name = "uniffi-bindgen"
path = "src/main.rs"

[dependencies]
uniffi = { workspace = true, features = ["cli"] }
