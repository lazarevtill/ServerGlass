# F-Droid build recipe for ServerGlass.
#
# Copy this into a fork of https://gitlab.com/fdroid/fdroiddata as
# `metadata/cloud.lazarev.serverglass.yml`, then open a merge request with the `New App` label.
#
# The build steps here have been dry-run against a clean clone outside the development tree (see
# docs/FDROID.md), but not yet inside F-Droid's own buildserver. The parts most likely still to
# need adjusting are the Rust install location and the NDK, because their image decides both.

Categories:
  - Internet
  - System
License: MIT OR Apache-2.0
AuthorName: Till Lazarev
AuthorEmail: lazarevtill@lazarev.cloud
SourceCode: https://github.com/lazarevtill/ServerGlass
IssueTracker: https://github.com/lazarevtill/ServerGlass/issues
# The per-version changelogs themselves, rather than the GitHub releases page: releases are
# published on the canonical GitLab, so the mirror's releases page is empty and would be a dead
# end for anyone who clicked it from the F-Droid listing.
Changelog: https://github.com/lazarevtill/ServerGlass/tree/main/fastlane/metadata/android/en-US/changelogs

AutoName: ServerGlass
Description: |-
  ServerGlass reads how your servers are doing over SSH, and installs nothing on them. If you can
  already ssh into a machine, you can watch it — there is no agent to deploy, no port to open, and
  nothing to undo later.

  The default screen is written for someone who does not know what SSH is: a plain-language
  verdict, three readings that mean something without training, and the names of whatever is
  working hardest. Every other reading is one tap away — per-core CPU, memory, each network
  interface, each disk, filesystems, temperatures, sockets.

  Passwords and keys are kept in the Android Keystore and sent to nothing but the server you are
  connecting to. No account, no upload, and no measurement written to disk.

RepoType: git
Repo: https://github.com/lazarevtill/ServerGlass.git

Builds:
  - versionName: 0.4.0
    versionCode: 6
    commit: v0.4.0
    subdir: apps/android/app
    gradle:
      - yes
    # r27d is 27.3.13750724, the version scripts/build-android.sh names. What actually has to match
    # is the -P 26 below and minSdk in app/build.gradle.kts — the NDK links against that API
    # level's libc, and a mismatch is a loader failure at runtime rather than an error at build
    # time. The r27 point release itself is not load-bearing, so if the buildserver image does not
    # carry r27d, r27c is a safe substitution.
    ndk: r27d
    # The core is Rust, cross-compiled to the NDK. Gradle downloads none of it — the toolchain is
    # installed here, before the build runs, and everything it compiles is source in this repo.
    #
    # It goes to /opt/rust rather than $HOME because `sudo:` runs as root and `prebuild:` does not,
    # so anything installed into root's home is invisible by the time it is needed. CARGO_HOME is
    # deliberately left alone for the same reason inverted: cargo must write its registry cache at
    # build time, as the build user, into a directory that user owns.
    sudo:
      - apt-get update
      - apt-get install -y curl build-essential pkg-config
      - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup.sh
      - env RUSTUP_HOME=/opt/rust CARGO_HOME=/opt/rust sh /tmp/rustup.sh -y
        --default-toolchain 1.89.0 --profile minimal --no-modify-path
      - env RUSTUP_HOME=/opt/rust CARGO_HOME=/opt/rust /opt/rust/bin/rustup target add aarch64-linux-android
      - env RUSTUP_HOME=/opt/rust CARGO_HOME=/opt/rust /opt/rust/bin/cargo install cargo-ndk --version 4.1.2 --locked
      - chmod -R a+rX /opt/rust
    prebuild:
      - export RUSTUP_HOME=/opt/rust PATH=/opt/rust/bin:$PATH ANDROID_NDK_HOME=$$NDK$$
      # minSdk 26 must match app/build.gradle.kts.
      - cd $$SRC$$ && cargo ndk -t arm64-v8a -P 26
        -o apps/android/app/src/main/jniLibs build --release -p sg-ffi
      # The Kotlin bindings are generated from the *host* library: uniffi reads architecture
      # independent metadata, and there is no Android .so to introspect on the build machine.
      - cd $$SRC$$ && cargo build -p sg-ffi
      # `--bin` is not optional. sg-bindgen also ships a C# generator for the Windows app, so an
      # unqualified `cargo run -p sg-bindgen` is ambiguous and fails. This matters most when
      # AutoUpdateMode copies this block forward to a release that has both binaries.
      - cd $$SRC$$ && cargo run -q -p sg-bindgen --bin uniffi-bindgen -- generate
        --library target/debug/libsg_ffi.so
        --language kotlin
        --out-dir apps/android/app/build/generated/uniffi
    scanignore:
      # The .so is produced by the prebuild step above, from source in this same repository. It is
      # not a prebuilt blob — nothing binary is committed, and `git ls-files` will confirm it.
      - apps/android/app/src/main/jniLibs

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9.]+$
CurrentVersion: 0.4.0
CurrentVersionCode: 6
